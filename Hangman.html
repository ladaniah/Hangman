<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="Hangman.css">
    <script src="Hangman.js" defer></script>
</head>
<body>
    <div>
        <img id="hangmanpic" src="images/hangman6.gif" alt="Picture of Hangman">
    </div>
    <div id="clue">Press New Game to Play</div>
    <div>
        <input type="text" id="guess" size="1" maxlength="1">
        <button onclick="guess()">Guess</button>
    </div>
    <div id="newgamearea">
        <button onclick="newGame()">New Game</button>
    </div>
    <div id = "guesses"></div>
</body>
</html>
